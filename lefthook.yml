# lefthook.yml — Lefthook configuration for pre-commit secret scrubbing
#
# See: https://github.com/evilmartians/lefthook
#
# The `memory-secret-scan` command runs on every commit against staged files
# under .opencode/memory/. It uses the shared pattern module at
# scripts/memory-secret-patterns.mjs (SSoT shared with memory:lint / #28).
#
# Bypass: git commit --no-verify (emergency escape valve)
# Safety net: CI memory:lint step enforces the same check post-push

pre-commit:
  commands:
    memory-secret-scan:
      tags: security
      glob: ".opencode/memory/**"
      # #72: integrity-control artifacts (embeddings.lock, sqlite-vec.lock)
      # have their own SR3/SR4 hash-verification controls and contain only
      # deterministic hashes. Exclude them at the lefthook layer here, and
      # also at the script layer (`shouldSkipPath` in secret-scan.mjs) as
      # defense-in-depth. Single-quoted YAML strings avoid backslash escape
      # interpretation so the regex source is preserved verbatim.
      exclude:
        - 'memory\.db.*'
        - '.*\.lock$'
      run: node .lefthook/scripts/secret-scan.mjs {staged_files}
