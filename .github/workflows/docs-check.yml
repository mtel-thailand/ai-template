name: Docs Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check docs are updated when source changes
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          SOURCE_CHANGED=$(git diff --name-only "$BASE".."$HEAD" -- src/ | wc -l)
          DOCS_CHANGED=$(git diff --name-only "$BASE".."$HEAD" -- docs/ | wc -l)

          HAS_SKIP_LABEL="${{ contains(github.event.pull_request.labels.*.name, 'docs-skip') }}"

          if [ "$SOURCE_CHANGED" -gt 0 ] && [ "$DOCS_CHANGED" -eq 0 ] && [ "$HAS_SKIP_LABEL" != "true" ]; then
            echo "❌ Source files changed but docs/ was not updated."
            echo ""
            echo "Changed source files:"
            git diff --name-only "$BASE".."$HEAD" -- src/
            echo ""
            echo "If these changes don't require documentation updates,"
            echo "add the 'docs-skip' label to this PR."
            echo ""
            exit 1
          fi

          if [ "$DOCS_CHANGED" -gt 0 ]; then
            echo "✅ Docs were updated alongside source changes."
          elif [ "$SOURCE_CHANGED" -eq 0 ]; then
            echo "✅ No source changes to check."
          else
            echo "✅ Skipped (docs-skip label applied)."
          fi
