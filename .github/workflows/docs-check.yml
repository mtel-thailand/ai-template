name: Docs Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    env:
      # Read the docs-skip label at workflow-render time so the shell step
      # can honor it. AGENTS.md documents this as a working bypass.
      HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'docs-skip') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check docs are updated when source changes
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          ALL_CHANGED=$(git diff --name-only "$BASE".."$HEAD")
          DOCS_CHANGED=$(git diff --name-only "$BASE".."$HEAD" -- docs/ | wc -l)

          # Excluded buckets: docs/, .github/, .opencode/, dotfiles, README,
          # LICENSE, package*, and any *.md file.
          #
          # PIPEFAIL GOTCHA: GitHub Actions defaults bash to `set -e -o pipefail`.
          # If every changed file matches this regex, `grep -vE` filters them
          # all out and exits 1, which pipefail propagates and `set -e` turns
          # into a false CI failure. The trailing `|| true` neutralizes that
          # for the empty-result case. Do NOT remove it. See issue #79.
          EXCLUDE_RE='^(docs/|\.github/|\.opencode/|\.gitignore|\.env|README|LICENSE|package)|\.md$'
          SOURCE_CHANGED=$(echo "$ALL_CHANGED" | grep -vE "$EXCLUDE_RE" | wc -l || true)

          if [ "$SOURCE_CHANGED" -gt 0 ] && [ "$DOCS_CHANGED" -eq 0 ] && [ "$HAS_SKIP_LABEL" != "true" ]; then
            echo "❌ Source files changed but docs/ was not updated."
            echo ""
            echo "Changed source files (excluding docs/, .github/, .opencode/):"
            echo "$ALL_CHANGED" | grep -vE "$EXCLUDE_RE" || true
            echo ""
            echo "If these changes don't require documentation updates,"
            echo "add the 'docs-skip' label to this PR."
            echo ""
            exit 1
          fi

          if [ "$DOCS_CHANGED" -gt 0 ]; then
            echo "✅ Docs were updated alongside source changes."
          elif [ "$SOURCE_CHANGED" -eq 0 ]; then
            echo "✅ No source changes to check."
          else
            echo "✅ Skipped (docs-skip label applied)."
          fi

  validate-memory:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 📦 Install
        run: npm ci
      - name: 🧹 Validate memory frontmatter
        run: node scripts/memory-gc.mjs --validate-only
