name: Docs Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check docs are updated when source changes
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          ALL_CHANGED=$(git diff --name-only "$BASE".."$HEAD")
          DOCS_CHANGED=$(git diff --name-only "$BASE".."$HEAD" -- docs/ | wc -l)

          # Count files changed outside docs, .github, .opencode, and common non-source paths
          SOURCE_CHANGED=$(echo "$ALL_CHANGED" | grep -v "^docs/" | grep -v "^\.github/" | grep -v "^\.opencode/" | grep -v "^\.gitignore" | grep -v "^\.env" | grep -v "^README" | grep -v "^LICENSE" | grep -v "^package" | grep -v "\.md$" | wc -l)

          HAS_SKIP_LABEL="${{ contains(github.event.pull_request.labels.*.name, 'docs-skip') }}"

          if [ "$SOURCE_CHANGED" -gt 0 ] && [ "$DOCS_CHANGED" -eq 0 ] && [ "$HAS_SKIP_LABEL" != "true" ]; then
            echo "❌ Source files changed but docs/ was not updated."
            echo ""
            echo "Changed source files (excluding docs/, .github/, .opencode/):"
            echo "$ALL_CHANGED" | grep -v "^docs/" | grep -v "^\.github/" | grep -v "^\.opencode/" | grep -v "^\.gitignore" | grep -v "^\.env" | grep -v "^README" | grep -v "^LICENSE" | grep -v "^package" | grep -v "\.md$"
            echo ""
            echo "If these changes don't require documentation updates,"
            echo "add the 'docs-skip' label to this PR."
            echo ""
            exit 1
          fi

          if [ "$DOCS_CHANGED" -gt 0 ]; then
            echo "✅ Docs were updated alongside source changes."
          elif [ "$SOURCE_CHANGED" -eq 0 ]; then
            echo "✅ No source changes to check."
          else
            echo "✅ Skipped (docs-skip label applied)."
          fi

  validate-memory:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 📦 Install
        run: npm install --no-audit --no-fund
      - name: 🧹 Validate memory frontmatter
        run: node scripts/memory-gc.mjs --validate-only
